<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>IoT Light Monitoring Dashboard</title>

    <!-- ================= STYLE ================= -->
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }

        h2 {
            color: #222;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            width: 400px;
        }

        .value {
            font-size: 22px;
            margin-top: 10px;
        }

        canvas {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<h2>HỆ THỐNG GIÁM SÁT ÁNH SÁNG</h2>

<div class="box">
    <div class="value" id="luxText">Lux: --</div>
    <div class="value" id="ledText">LED: --</div>
</div>

<canvas id="luxChart" width="800" height="400"></canvas>

<!-- ================= CHART.JS ================= -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- ================= FIREBASE ================= -->
<script type="module">

/* ========== IMPORT FIREBASE SDK ========== */
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import { getDatabase, ref, onValue } from
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

/* ========== FIREBASE CONFIG ========== */
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "YOUR_PROJECT_ID"
};

/* ========== INIT FIREBASE ========== */
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

/* ========== CHART INIT ========== */
const ctx = document.getElementById("luxChart").getContext("2d");

const luxData = [];
const timeLabels = [];

const luxChart = new Chart(ctx, {
    type: "line",
    data: {
        labels: timeLabels,
        datasets: [{
            label: "Lux",
            data: luxData,
            borderColor: "blue",
            tension: 0.3,
            fill: false
        }]
    },
    options: {
        animation: false,
        scales: {
            y: { beginAtZero: true }
        }
    }
});

/* ========== FIREBASE LISTENER ========== */
const deviceRef = ref(database, "devices/node_01");

onValue(deviceRef, (snapshot) => {

    const data = snapshot.val();
    if (!data) return;

    // Update text
    document.getElementById("luxText").innerText =
        "Lux: " + data.lux;

    document.getElementById("ledText").innerText =
        "LED: " + (data.led === 1 ? "ON" : "OFF");

    // Update chart
    updateChart(data.lux);
});

/* ========== UPDATE CHART FUNCTION ========== */
function updateChart(lux) {

    const now = new Date().toLocaleTimeString();

    luxData.push(lux);
    timeLabels.push(now);

    if (luxData.length > 30) {
        luxData.shift();
        timeLabels.shift();
    }

    luxChart.update();
}

</script>

</body>
</html>
